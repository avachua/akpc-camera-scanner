
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AKPC Boarding Gate QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #182238;
      background: #f3f5f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 12px; }
    main {
      max-width: 560px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000012;
    }
    header { text-align: center; margin-bottom: 22px; }
    h1 { font-size: 23px; margin: 0 0 7px; }
    header p { color: #667085; margin: 0; }
    label { display: block; font-weight: bold; margin: 16px 0 7px; }
    select, input, button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
    }
    select, input { border: 1px solid #cbd2df; background: white; }
    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
      background: #123b72;
      color: white;
      margin-top: 10px;
    }
    button.secondary { background: #e8edf5; color: #18304f; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #reader {
      width: 100%;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 10px;
    }
    #status {
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      background: #eef2f7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }
    #status.good { background: #e4f7e9; color: #14532d; }
    #status.bad { background: #fde8e8; color: #991b1b; }
    #status.warn { background: #fff3d6; color: #754c00; }
    .small { color: #667085; font-size: 13px; line-height: 1.5; }
    .section { margin-top: 18px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>ATENEO KNIGHTS PICKLEBALL CLUB</h1>
    <p>AKPC Boarding Gate QR Scanner</p>
  </header>

  <label for="eventSelect">Select Event</label>
  <select id="eventSelect">
    <option value="">Loading events...</option>
  </select>

  <button id="refreshBtn" class="secondary" type="button">
    REFRESH EVENTS
  </button>

  <div id="reader"></div>

  <button id="startBtn" type="button">OPEN CAMERA</button>
  <button id="stopBtn" class="secondary" type="button" disabled>
    CLOSE CAMERA
  </button>

  <div class="section">
    <label for="manualQr">Manual QR Code Entry</label>
    <input id="manualQr" type="text" placeholder="Enter or paste QR code data">
    <button id="manualBtn" class="secondary" type="button">
      VALIDATE QR
    </button>
  </div>

  <div id="status" role="status" aria-live="polite">
    Loading events. Please wait...
  </div>

  <p class="small">
    Select the correct active event before scanning. If camera access is
    blocked, allow camera permission for this website in Chrome settings.
  </p>
</main>

<script>
(() => {
  "use strict";

  const API_URL =
    "https://script.google.com/a/macros/addu.edu.ph/s/AKfycbwZOYoWt__IVF8NXy_ZSWTohlqWg5yKbHxZZP1Lv2Lz-7mTt_ab1fjdRaMBDmKE5yH8Ng/exec";

  const $ = id => document.getElementById(id);
  const eventSelect = $("eventSelect");
  const statusBox = $("status");
  const startBtn = $("startBtn");
  const stopBtn = $("stopBtn");
  const refreshBtn = $("refreshBtn");
  const manualBtn = $("manualBtn");

  let scanner = null;
  let cameraRunning = false;
  let validating = false;
  let lastScannedText = "";
  let lastScannedAt = 0;

  function showStatus(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = type;
  }

  function jsonp(params, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const callbackName =
        "akpcCallback_" + Date.now() + "_" +
        Math.random().toString(36).slice(2);

      const script = document.createElement("script");
      const url = new URL(API_URL);

      if (API_URL.includes("PASTE_YOUR")) {
        reject(new Error("SETUP REQUIRED: Replace API_URL with your deployed Apps Script URL ending in /exec."));
        return;
      }

      Object.entries(params).forEach(([key, value]) => {
        url.searchParams.set(key, value);
      });
      url.searchParams.set("callback", callbackName);

      let finished = false;

      const timer = setTimeout(() => {
        finish(new Error(
          "Request timed out. Check the Apps Script deployment and internet connection."
        ));
      }, timeoutMs);

      function cleanup() {
        clearTimeout(timer);
        delete window[callbackName];
        script.remove();
      }

      function finish(error, data) {
        if (finished) return;
        finished = true;
        cleanup();
        if (error) reject(error);
        else resolve(data);
      }

      window[callbackName] = data => finish(null, data);
      script.onerror = () => finish(new Error(
        "Could not contact Apps Script. Check the deployed /exec URL and web app permissions."
      ));

      script.src = url.toString();
      document.body.appendChild(script);
    });
  }

  function getEventsFromResponse(data) {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.events)) return data.events;
    if (data && Array.isArray(data.data)) return data.data;
    return [];
  }

  async function loadEvents() {
    refreshBtn.disabled = true;
    showStatus("Loading active events...");

    try {
      const response = await jsonp({ api: "events" });

      if (response && response.success === false) {
        throw new Error(response.message || "Could not load events.");
      }

      const events = getEventsFromResponse(response);
      eventSelect.replaceChildren();

      const firstOption = document.createElement("option");
      firstOption.value = "";
      firstOption.textContent = events.length
        ? "Select an event..."
        : "No active events found";
      eventSelect.appendChild(firstOption);

      events.forEach(event => {
        if (!event || !event.id) return;

        const option = document.createElement("option");
        option.value = String(event.id);

        const name = event.name || event.eventName || "Unnamed event";
        const date = event.date ? " — " + event.date : "";
        option.textContent = name + date;

        eventSelect.appendChild(option);
      });

      if (events.length) {
        showStatus("Events loaded. Select an event and open the camera.", "good");
      } else {
        showStatus(
          "No active events were returned. Check that your EVENTS sheet has events marked ACTIVE.",
          "warn"
        );
      }
    } catch (error) {
      eventSelect.replaceChildren();
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "Could not load events";
      eventSelect.appendChild(option);
      showStatus("EVENT LOADING ERROR\n" + error.message, "bad");
    } finally {
      refreshBtn.disabled = false;
    }
  }

  function cameraErrorMessage(error) {
    const name = error && error.name ? error.name : "";
    const message = error && error.message ? error.message : "";

    if (name === "NotAllowedError" || name === "PermissionDeniedError") {
      return "CAMERA ACCESS DENIED\n\n" +
        "1. Open Chrome Site Settings for this GitHub Pages website.\n" +
        "2. Set Camera to Allow.\n" +
        "3. Check Windows Settings > Privacy & security > Camera.\n" +
        "4. Reload the page and try again.\n\n" +
        "If the page is embedded in another website, open it directly in Chrome.\n\n" +
        message;
    }

    if (name === "NotFoundError" || name === "DevicesNotFoundError") {
      return "NO CAMERA FOUND\n\nConnect a camera or use a device with a camera, then try again.";
    }

    if (name === "NotReadableError" || name === "TrackStartError") {
      return "CAMERA IS BUSY OR UNAVAILABLE\n\nClose other apps or browser tabs using the camera, then try again.";
    }

    if (location.protocol !== "https:" && location.hostname !== "localhost") {
      return "SECURE CONNECTION REQUIRED\n\nOpen the scanner through its HTTPS GitHub Pages address.";
    }

    return "CAMERA ERROR\n\n" + (message || "The camera could not be started.") +
      "\n\nCheck Chrome camera permission and try again.";
  }

  async function startCamera() {
    if (cameraRunning) return;

    if (!window.Html5Qrcode) {
      showStatus(
        "SCANNER LIBRARY FAILED TO LOAD\n\nCheck your internet connection and reload the page.",
        "bad"
      );
      return;
    }

    if (!eventSelect.value) {
      showStatus("Please select an active event before opening the camera.", "warn");
      return;
    }

    startBtn.disabled = true;
    showStatus("Requesting camera access...");

    try {
      scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1
        },
        decodedText => {
          const now = Date.now();

          // Prevent repeated processing of the same QR during rapid scans.
          if (validating) return;
          if (decodedText === lastScannedText && now - lastScannedAt < 3000) return;

          lastScannedText = decodedText;
          lastScannedAt = now;
          validateQR(decodedText);
        },
        () => {
          // Ignore normal frame-by-frame QR detection misses.
        }
      );

      cameraRunning = true;
      stopBtn.disabled = false;
      showStatus("Camera is running. Scan the member's QR code.", "good");
    } catch (error) {
      cameraRunning = false;
      scanner = null;
      showStatus(cameraErrorMessage(error), "bad");
    } finally {
      startBtn.disabled = false;
    }
  }

  async function stopCamera() {
    if (!scanner) {
      cameraRunning = false;
      stopBtn.disabled = true;
      return;
    }

    try {
      if (cameraRunning) await scanner.stop();
      await scanner.clear();
    } catch (error) {
      console.warn("Camera stop warning:", error);
    } finally {
      scanner = null;
      cameraRunning = false;
      stopBtn.disabled = true;
      startBtn.disabled = false;
      showStatus("Camera closed.");
    }
  }

  async function validateQR(qrText) {
    const eventId = eventSelect.value;

    if (!eventId) {
      showStatus("Please select an event first.", "warn");
      return;
    }

    const qr = String(qrText || "").trim();
    if (!qr) {
      showStatus("Please scan or enter a QR code.", "warn");
      return;
    }

    if (validating) return;
    validating = true;
    manualBtn.disabled = true;
    showStatus("Validating QR code...");

    try {
      const response = await jsonp({
        api: "validateBoarding",
        qr: qr,
        eventId: eventId
      });

      if (!response || typeof response !== "object") {
        throw new Error("Unexpected response from Apps Script.");
      }

      const message = response.message ||
        response.error ||
        response.memberName ||
        (response.success ? "QR validated successfully." : "QR validation failed.");

      const successful =
        response.success === true ||
        response.ok === true ||
        response.valid === true ||
        String(response.status || "").toUpperCase() === "BOARDED";

      showStatus(
        (successful ? "SUCCESS\n\n" : "NOT COMPLETED\n\n") + message,
        successful ? "good" : "bad"
      );

      if (successful) $("manualQr").value = "";
    } catch (error) {
      showStatus("VALIDATION ERROR\n\n" + error.message, "bad");
    } finally {
      validating = false;
      manualBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener("click", loadEvents);
  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", stopCamera);

  manualBtn.addEventListener("click", () => {
    validateQR($("manualQr").value);
  });

  $("manualQr").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      validateQR($("manualQr").value);
    }
  });

  eventSelect.addEventListener("change", () => {
    showStatus(eventSelect.value
      ? "Event selected. You can now open the camera."
      : "Please select an event.");
  });

  loadEvents();
})();
</script>
</body>
</html>
