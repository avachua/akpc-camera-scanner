
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKPC Boarding Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#102b4e;padding:16px;margin:0}
main{max-width:500px;margin:auto}
section{background:white;padding:20px;border-radius:14px;margin-bottom:16px}
h2{text-align:center}
input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;font-size:16px;border-radius:8px}
input{border:1px solid #bbb}
button{border:0;background:#102b4e;color:white;font-weight:bold}
#reader{width:100%;min-height:250px;margin-top:15px}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<section>
<h2>ATENEO KNIGHTS PICKLEBALL CLUB</h2>
<p>AKPC Boarding Gate QR Scanner</p>
<label for="event">Event ID</label>
<input id="event" placeholder="Enter event ID">
</section>

<section>
<h3>Camera Scanner</h3>
<div id="reader"></div>
<button id="start" onclick="startCamera()">START CAMERA</button>
<button onclick="stopCamera()">STOP CAMERA</button>
<p id="status">Ready. Enter an event ID, then start the camera.</p>
</section>
</main>

<script>
let scanner=null;
let running=false;

function status(message){
  document.getElementById("status").textContent=message;
}

async function startCamera(){
  if(running)return;

  if(!document.getElementById("event").value.trim()){
    status("Please enter the Event ID first.");
    return;
  }

  if(typeof Html5Qrcode==="undefined"){
    status("Scanner library did not load. Check your internet connection and reload.");
    return;
  }

  document.getElementById("start").disabled=true;

  try{
    scanner=new Html5Qrcode("reader");
    status("Requesting camera permission...");

    await scanner.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:220,height:220}},
      async text=>{
        status("QR CODE DETECTED:\n"+text+
          "\n\nEvent: "+document.getElementById("event").value.trim()+
          "\n\nCamera works. Google Sheets validation is not connected yet.");
        await stopCamera();
      },
      ()=>{}
    );

    running=true;
    status("Camera started. Point it at a QR code.");
  }catch(error){
    status("CAMERA ERROR:\n"+(error.message||error)+
      "\n\nOpen the HTTPS website directly in Safari or Chrome and allow camera access.");
    if(scanner){
      try{scanner.clear()}catch(e){}
      scanner=null;
    }
  }finally{
    document.getElementById("start").disabled=false;
  }
}

async function stopCamera(){
  if(scanner){
    try{
      if(running) await scanner.stop();
    }catch(e){}
    try{scanner.clear()}catch(e){}
  }
  scanner=null;
  running=false;
  document.getElementById("start").disabled=false;
  status("Camera stopped. Press START CAMERA to try again.");
}
</script>
</body>
</html>
